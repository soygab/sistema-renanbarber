<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RenanBarber</title>
    <link rel="stylesheet" href="/public/styles/style.css">
</head>
<body>
    <section class="login-cadastro">
        <div class="login-principal">    

            <div class="logo">
                <img src="/public/image/logo_renanbarber.svg" alt="Logo RenanBarber">
            </div>
            
            <div class="titulos-login">
                <h1>Entrar</h1>
                <h1>Cadastrar</h1>
            </div>

            <div class="login">
                <label class="control-label" for="email-login">E-mail</label>
                <input type="text" class="form-group" placeholder="Digite seu email" id="email-login">

                <label class="control-label" for="senha-login">Senha</label>
                <input type="text" class="form-group" placeholder="Digite sua senha" id="senha-login">

                <button type="submit" class="btn-login">Entrar</button>
            </div>

            <div class="cadastro">
                <label class="control-label" for="nome-cadastro">Nome</label>
                <input type="text" class="form-group" placeholder="Digite seu nome" id="nome-cadastro">

                <label class="control-label" for="sobrenome-cadastro">Sobrenome</label>
                <input type="text" class="form-group" placeholder="Digite seu sobrenome" id="sobrenome-cadastro">

                <label class="control-label" for="email-cadastri">E-mail</label>
                <input type="text" class="form-group" placeholder="Digite seu email" id="email-cadastro">

                <label class="control-label" for="senha-cadastro">Senha</label>
                <input type="text" class="form-group" placeholder="Digite sua senha" id="senha-cadastro">
                <p>Sua senha deve obter no mínimo 8 dígitos.</p>

                <button type="submit" class="btn-cadastro">Cadastrar</button>
            </div>
        </div>
    </section>
</body>
</html>
